<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Taskboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">

<div class="auth-screen">
  <div class="auth-card">
    <div class="brand auth-brand">
      <span class="brand-mark">TB</span>
      <span class="brand-name">Taskboard</span>
    </div>

    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Start tracking your tasks in a few seconds.</p>

    <form id="signup-form" class="auth-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="rakshan123" minlength="3" maxlength="50" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="rakshan@example.com" required>
        <p class="field-error" id="email-error" hidden></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-input-wrap">
          <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required>
          <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"></svg>
          </button>
        </div>
        <p class="field-error" id="password-error" hidden></p>
      </div>

      <p class="auth-error" id="auth-error" hidden></p>

      <button type="submit" class="btn-add auth-submit">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login_page') }}">Sign in</a></p>
  </div>
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script>initAuthForm('signup-form', '/api/signup');</script>
</body>
</html>
