<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Taskboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">

<div class="auth-screen">
  <div class="auth-card">
    <div class="brand auth-brand">
      <span class="brand-mark">TB</span>
      <span class="brand-name">Taskboard</span>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to see your tasks.</p>

    <form id="login-form" class="auth-form" novalidate>
      <div class="field">
        <label for="username">Username or email</label>
        <input type="text" id="username" name="username" placeholder="rakshan123" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-input-wrap">
          <input type="password" id="password" name="password" placeholder="Your password" required>
          <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"></svg>
          </button>
        </div>
        <p class="field-error" id="password-error" hidden></p>
      </div>

      <p class="auth-error" id="auth-error" hidden></p>

      <button type="submit" class="btn-add auth-submit">Sign in</button>
    </form>

    <p class="auth-switch">New here? <a href="{{ url_for('auth.signup_page') }}">Create an account</a></p>
  </div>
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script>initAuthForm('login-form', '/api/login');</script>
</body>
</html>
